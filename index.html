<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nomi AI Agent — The calm cat for busy days</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --u: clamp(0.8px, min(calc(100vw / 982), calc(100vh / 696)), 1.7px);
      --gutter: calc(var(--u) * 21);
      --ink: #050505;
      --paper: #e7e7e7;
      --vs: max(calc(100vw / 1920), calc(100vh / 1080));
    }
    html, body { height: 100%; background: var(--paper); }
    body {
      color: var(--ink);
      overflow-x: hidden;
      font-family: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; text-decoration: none; }

    .hero {
      position: relative;
      height: 100vh;
      min-height: 460px;
      width: 100%;
      overflow: hidden;
      isolation: isolate;
      background: var(--paper);
    }
    .hero__media {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: 62% 50%;
      z-index: -1;
      pointer-events: none;
    }

    .nav {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: calc(var(--u) * 80);
      padding: 0 calc(var(--u) * 23) 0 var(--gutter);
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 2;
    }
    .nav__logo {
      display: block;
      width: calc(var(--u) * 22);
      height: calc(var(--u) * 22);
      flex-shrink: 0;
    }
    .nav__logo svg {
      display: block;
      width: 100%;
      height: 100%;
    }
    .nav__links {
      display: flex;
      gap: calc(var(--u) * 25);
      list-style: none;
    }
    .nav__links a {
      font-size: calc(var(--u) * 11);
      line-height: 1;
      letter-spacing: -0.01em;
      transition: opacity 0.2s;
    }
    .nav__links a:hover {
      opacity: 0.55;
    }
    .nav__toggle {
      display: none;
    }

    .hero__title {
      position: absolute;
      top: 23.1%;
      left: calc(var(--u) * 27);
      width: calc(var(--u) * 436);
      line-height: 0;
    }
    .hero__title svg {
      display: block;
      width: 100%;
      height: auto;
      fill: var(--ink);
    }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      clip-path: inset(50%);
      white-space: nowrap;
      border: 0;
    }

    .bubble {
      --b: max(2px, calc(var(--u) * 2));
      position: absolute;
      left: calc((100vw - 1920 * var(--vs)) * 0.62 + 1920 * var(--vs) * 0.70);
      top: calc((100vh - 1080 * var(--vs)) * 0.5 + 1080 * var(--vs) * 0.24);
      transform: translateY(calc(-100% - var(--u) * 12));
      padding: calc(var(--u) * 11) calc(var(--u) * 15);
      background: var(--paper);
      box-shadow:
        0 calc(var(--b) * -1) 0 0 var(--ink),
        0 var(--b) 0 0 var(--ink),
        calc(var(--b) * -1) 0 0 0 var(--ink),
        var(--b) 0 0 0 var(--ink);
      font-size: calc(var(--u) * 13.3);
      line-height: calc(var(--u) * 18);
      white-space: nowrap;
      z-index: 1;
    }
    .bubble__tail {
      position: absolute;
      left: calc(var(--u) * 14);
      top: calc(100% + var(--b) - 1px);
      width: calc(var(--u) * 18);
      height: calc(var(--u) * 18);
      overflow: visible;
    }
    .bubble__cursor {
      display: inline-block;
      width: 0.55em;
      height: 1.05em;
      margin-left: 0.3em;
      background: var(--ink);
      vertical-align: -0.2em;
      animation: blink 1.06s steps(1) infinite;
    }
    @keyframes blink {
      50% { opacity: 0; }
    }

    .hero__body {
      position: absolute;
      left: var(--gutter);
      bottom: 17.4%;
    }
    .hero__lede {
      font-size: calc(var(--u) * 13.3);
      line-height: calc(var(--u) * 17);
      margin-bottom: calc(var(--u) * 46);
    }
    .hero__actions {
      display: flex;
      align-items: center;
      gap: calc(var(--u) * 17);
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: calc(var(--u) * 31);
      padding: 0 calc(var(--u) * 19);
      border-radius: calc(var(--u) * 2);
      background: var(--ink);
      color: #dcdcda;
      font-size: calc(var(--u) * 11);
      white-space: nowrap;
      transition: background 0.2s, transform 0.2s;
    }
    .btn:hover {
      background: #2a2a2a;
      transform: translateY(-1px);
    }
    .link {
      display: inline-flex;
      align-items: center;
      gap: calc(var(--u) * 9);
      font-size: calc(var(--u) * 11);
    }
    .link svg {
      width: calc(var(--u) * 5);
      height: calc(var(--u) * 8);
      fill: none;
      stroke: currentColor;
      stroke-width: 1.4;
      transition: transform 0.2s;
    }
    .link:hover svg {
      transform: translateX(calc(var(--u) * 3));
    }
    .hero__stats {
      display: flex;
      flex-wrap: wrap;
      gap: calc(var(--u) * 8) calc(var(--u) * 14);
      margin-top: calc(var(--u) * 30);
      font-size: calc(var(--u) * 11);
      line-height: 1;
      list-style: none;
    }
    .hero__stats li {
      white-space: nowrap;
    }
    .hero__stats li + li::before {
      content: "";
      display: inline-block;
      width: calc(var(--u) * 3);
      height: calc(var(--u) * 3);
      margin-right: calc(var(--u) * 14);
      background: var(--ink);
      vertical-align: middle;
    }

    @media (prefers-reduced-motion: reduce) {
      .bubble__cursor {
        animation: none;
      }
    }

    @media (max-width: 720px) {
      :root {
        --u: clamp(0.8px, calc(100vw / 400), 1.5px);
        --gutter: calc(var(--u) * 20);
      }
      .hero {
        min-height: calc(var(--u) * 620);
      }
      .hero__media {
        top: 27%;
        bottom: auto;
        height: 50%;
        object-position: 73% 50%;
        -webkit-mask-image: linear-gradient(to bottom, transparent, #000 14%, #000 86%, transparent);
        mask-image: linear-gradient(to bottom, transparent, #000 14%, #000 86%, transparent);
      }
      .nav {
        height: calc(var(--u) * 68);
        padding-right: var(--gutter);
      }
      .nav__logo {
        width: calc(var(--u) * 26);
        height: calc(var(--u) * 26);
      }
      .nav__toggle {
        display: flex;
        align-items: center;
        justify-content: center;
        width: calc(var(--u) * 40);
        height: calc(var(--u) * 40);
        margin-right: calc(var(--u) * -9);
        padding: 0;
        border: none;
        background: transparent;
        color: var(--ink);
        cursor: pointer;
      }
      .nav__toggle span {
        position: relative;
        display: block;
        width: calc(var(--u) * 22);
        height: calc(var(--u) * 2);
        background: currentColor;
        transition: transform 0.25s;
        transform: translateY(calc(var(--u) * -3.5));
      }
      .nav__toggle span::after {
        content: "";
        position: absolute;
        left: 0;
        top: calc(var(--u) * 7);
        width: calc(var(--u) * 22);
        height: calc(var(--u) * 2);
        background: currentColor;
        transition: transform 0.25s;
      }
      .nav.is-open .nav__toggle span {
        transform: translateY(calc(var(--u) * 1.5)) rotate(45deg);
      }
      .nav.is-open .nav__toggle span::after {
        top: 0;
        transform: rotate(-90deg);
      }
      .nav__links {
        position: absolute;
        top: 100%;
        left: var(--gutter);
        right: var(--gutter);
        flex-direction: column;
        gap: 0;
        padding: calc(var(--u) * 6) calc(var(--u) * 16);
        border-radius: calc(var(--u) * 2);
        background: var(--ink);
        opacity: 0;
        visibility: hidden;
        transform: translateY(calc(var(--u) * -6));
        transition: opacity 0.2s, visibility 0.2s, transform 0.2s;
      }
      .nav.is-open .nav__links {
        opacity: 1;
        visibility: visible;
        transform: translateY(0);
      }
      .nav__links li + li {
        border-top: 1px solid rgba(255, 255, 255, 0.14);
      }
      .nav__links a {
        display: block;
        padding: calc(var(--u) * 14) 0;
        font-size: calc(var(--u) * 14);
        color: #ececea;
      }
      .nav__links a:hover {
        opacity: 1;
      }
      .hero__title {
        top: calc(var(--u) * 92);
        left: var(--gutter);
        width: min(calc(100% - 2 * var(--gutter)), calc(var(--u) * 396));
      }
      .hero__body {
        left: auto;
        right: var(--gutter);
        bottom: calc(var(--u) * 36);
      }
      .hero__lede {
        font-size: calc(var(--u) * 14);
        line-height: calc(var(--u) * 20);
        margin-bottom: calc(var(--u) * 24);
        max-width: 26em;
      }
      .hero__lede br {
        display: none;
      }
      .btn {
        height: calc(var(--u) * 42);
        padding: 0 calc(var(--u) * 22);
        font-size: calc(var(--u) * 13);
      }
      .link {
        font-size: calc(var(--u) * 13);
      }
      .hero__stats {
        margin-top: calc(var(--u) * 20);
        font-size: calc(var(--u) * 12);
      }
      .bubble {
        left: auto;
        right: var(--gutter);
        top: 27%;
        transform: translateY(calc(var(--u) * 4));
        font-size: calc(var(--u) * 12);
        line-height: calc(var(--u) * 16);
        padding: calc(var(--u) * 9) calc(var(--u) * 12);
      }
    }

    @media (max-width: 720px) and (max-height: 520px) {
      .hero__media {
        top: 0;
        bottom: auto;
        height: 100%;
        object-position: 100% 50%;
        -webkit-mask-image: none;
        mask-image: none;
      }
      .hero__title {
        width: calc(var(--u) * 230);
        top: calc(var(--u) * 70);
      }
      .bubble {
        display: none;
      }
    }
  </style>
</head>

  <script>
    (function () {
      var nav = document.getElementById('nav');
      var navToggle = document.getElementById('navToggle');
      var navLinks = document.getElementById('navLinks');
      var video = document.querySelector('.hero__media');

      function setMenuOpen(open) {
        nav.classList.toggle('is-open', open);
        navToggle.setAttribute('aria-expanded', open ? 'true' : 'false');
      }

      navToggle.addEventListener('click', function () {
        setMenuOpen(!nav.classList.contains('is-open'));
      });

      navLinks.addEventListener('click', function (e) {
        if (e.target.closest('a')) {
          setMenuOpen(false);
        }
      });

      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches && video) {
        video.pause();
      }
    })();
  </script>
</body>
</html>
